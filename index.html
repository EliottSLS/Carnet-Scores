var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------

<title>Carnet de Scores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Concept : un carnet Seyès (petits carreaux, marge rouge) où l'on écrit les scores à l'encre bleue ; fiches blanches posées dessus. */
:root{
  --paper:#f4f6fb; --line:rgba(70,110,200,.10); --line-strong:rgba(70,110,200,.20); --margin:rgba(214,69,61,.45);
  --surface:#ffffff; --surface-2:#eef1f9; --border:#d9deec;
  --ink:#1b2133; --ink-soft:#5b6378; --accent:#2541b2; --accent-ink:#ffffff; --accent-soft:#e3e8fb;
  --danger:#c7372f; --danger-soft:#fbe6e4; --good:#1f8a4c; --good-soft:#e1f4e8; --warn:#a96a00;
  --shadow:0 1px 2px rgba(27,33,51,.06),0 4px 14px rgba(27,33,51,.06);
  --f-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --g-skyjo:#13998c; --g-lc:#c58a12; --g-f7:#d8433b; --g-7w:#8a6a3f; --g-az:#2a6fdb;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141d; --line:rgba(140,165,255,.05); --line-strong:rgba(140,165,255,.09); --margin:rgba(235,100,90,.35);
  --surface:#1a1f2c; --surface-2:#232a3b; --border:#2e3649;
  --ink:#e8ebf4; --ink-soft:#9aa3b9; --accent:#8fa4ff; --accent-ink:#0d1020; --accent-soft:#252f52;
  --danger:#ff7a70; --danger-soft:#3a1f22; --good:#5fd08e; --good-soft:#173324; --warn:#f2b54a;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --g-skyjo:#3cc6b8; --g-lc:#e8b23f; --g-f7:#ff6f66; --g-7w:#d1a86b; --g-az:#6fa0ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141d; --line:rgba(140,165,255,.05); --line-strong:rgba(140,165,255,.09); --margin:rgba(235,100,90,.35);
  --surface:#1a1f2c; --surface-2:#232a3b; --border:#2e3649;
  --ink:#e8ebf4; --ink-soft:#9aa3b9; --accent:#8fa4ff; --accent-ink:#0d1020; --accent-soft:#252f52;

*{box-sizing:border-box}
html,body{min-height:100%;overscroll-behavior:none}
body{
  background-color:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.45;
  background-image:linear-gradient(var(--line-strong) 1px,transparent 1px),linear-gradient(90deg,var(--line-strong) 1px,transparent 1px),linear-gradient(var(--line) 1px,transparent 1px);
  background-size:32px 32px,32px 32px,100% 8px;
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;top:0;bottom:0;left:8px;width:1.5px;background:var(--margin);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:580px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.9rem;font-weight:800}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--ink-soft)}
.small{font-size:.86rem}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);font-weight:700}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--border)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:0 10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border);font-size:1.2rem;font-weight:700;flex:none}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;min-height:46px;width:100%;min-width:0}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
.err{color:var(--danger);font-size:.9rem;font-weight:700}

/* En-tête */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-left:8px}
.top .date{font-family:var(--f-display);color:var(--accent);font-weight:500;white-space:nowrap;font-size:.95rem}

/* Jeux */
.games{display:grid;gap:12px}
.game,.ghead{position:relative;overflow:hidden;border-radius:18px;color:var(--th-ink);background:var(--th-bg);box-shadow:var(--shadow)}
.game{display:block;width:100%;text-align:left;min-height:104px;padding:18px 16px}
.game-txt,.ghead-txt{position:relative;z-index:1;max-width:62%;display:flex;flex-direction:column;gap:4px}
.game h2{font-size:1.45rem;font-weight:800}
.game p{font-weight:700;font-size:.85rem;letter-spacing:.01em}
.game p,.ghead .eyebrow,.ghead-sub{color:var(--th-soft)}
.gart{position:absolute;right:-6px;bottom:-4px;height:112%;width:auto;pointer-events:none}
.ghead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 16px;min-height:110px}
.ghead-btn{margin:-6px 0 6px -6px}
.ghead .btn.ghost{background:var(--th-btn);color:var(--th-ink);border-radius:999px;min-height:34px;padding:0 14px;font-size:.88rem}
.ghead .btn.ghost::before{content:'← '}
.ghead .gart{opacity:.95}
.th-skyjo{--th-bg:linear-gradient(115deg,#1f3fa8 0%,#2b8fd6 32%,#3aa65a 56%,#f2c230 78%,#e2482f 100%);--th-ink:#fff;--th-soft:rgba(255,255,255,.82);--th-btn:rgba(0,0,0,.22)}
.th-skyjo .game-txt h2,.th-skyjo h1{text-shadow:0 2px 10px rgba(0,0,0,.25)}
.th-flip7{--th-bg:radial-gradient(circle at 80% 20%,#e0213f 0%,#a50f2a 55%,#6d0a1c 100%);--th-ink:#fff4dc;--th-soft:rgba(255,244,220,.78);--th-btn:rgba(0,0,0,.25)}
.th-lostcities{--th-bg:linear-gradient(160deg,#f6e8c8 0%,#e8cf9c 100%);--th-ink:#4a3418;--th-soft:#7a5f38;--th-btn:rgba(74,52,24,.12)}
.th-sevenw{--th-bg:linear-gradient(135deg,#2e2110 0%,#6b4f2a 100%);--th-ink:#f6e7c4;--th-soft:rgba(246,231,196,.75);--th-btn:rgba(0,0,0,.25)}
.th-sevenw h2,.th-sevenw h1{font-family:Georgia,"Times New Roman",serif;letter-spacing:.04em}
.th-azul{--th-bg:radial-gradient(circle at 85% 30%,#2a6fdb 0%,#123a8a 55%,#0b2257 100%);--th-ink:#fff;--th-soft:rgba(255,255,255,.78);--th-btn:rgba(0,0,0,.25)}
.th-flip7 h2,.th-flip7 h1{font-style:italic}
.game .vars{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);font-weight:700;font-size:.92rem}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.var{border-color:color-mix(in srgb,var(--gc) 55%,var(--border))}
.dot{width:12px;height:12px;border-radius:50%;background:var(--pc,var(--accent));flex:none}
.seg{display:flex;gap:8px}
.fo-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.fo-side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.fo-side b{max-width:100%}
.fo-mid{display:flex;flex-direction:column;align-items:center;gap:2px}
.fo-score{display:flex;align-items:center;gap:8px;font-size:2.4rem}
.fo-score .num{font-weight:800}
.vs2{color:var(--ink-soft);font-family:var(--f-display)}
.fo-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px}
.fo-mini{font-size:1.1rem}
.fo-dot{width:18px;height:18px;border-radius:50%;background:var(--pc)}
.chip[disabled]{opacity:.35}
.pl-open{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;padding:0}
.pedit{flex-direction:column;align-items:stretch!important;gap:10px!important;background:var(--surface-2);margin:6px -8px;padding:12px!important;border-radius:14px;border-bottom:0!important}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw-c{width:34px;height:34px;border-radius:50%;background:var(--pc);border:3px solid var(--surface)}
.sw-c.on{box-shadow:0 0 0 2.5px var(--ink)}
.sw-s{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1.5px solid var(--border);font-size:1.25rem;font-weight:800;font-family:var(--f-display);display:inline-flex;align-items:center;justify-content:center}
.sw-s.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.sym{font-size:1.1em;line-height:1;filter:saturate(1.1)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--pc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:.85rem;flex:none}
.list{display:flex;flex-direction:column}
.list > *{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);min-width:0}
.list > *:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume{width:100%;text-align:left}

/* Chooser teaser */
.chooser-cta{display:flex;align-items:center;gap:14px;text-align:left;width:100%}
.fingers{display:flex;flex:none}
.fingers span{width:26px;height:26px;border-radius:50%;margin-left:-8px;border:3px solid var(--surface);background:var(--pc)}
.fingers span:first-child{margin-left:0}

/* Tableau de scores */
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--border)}
table.scores{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;background:var(--surface)}
.scores th,.scores td{padding:10px 10px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
.scores thead th{font-size:.82rem;font-weight:700;color:var(--ink-soft);background:var(--surface-2)}
.scores th:first-child,.scores td:first-child{position:sticky;left:0;background:var(--surface-2);text-align:left;font-size:.82rem;color:var(--ink-soft);z-index:1}
.scores tbody tr{cursor:pointer}
.scores tbody tr:active td{background:var(--accent-soft)}
.scores td{font-family:var(--f-display);font-weight:700;font-size:1.02rem}
.scores tfoot td{font-size:1.2rem;border-bottom:0;color:var(--accent)}
.scores tfoot td.lead{background:var(--accent-soft)}
.tag{display:inline-block;font-size:.66rem;font-family:var(--f-body);font-weight:700;padding:1px 5px;border-radius:6px;background:var(--danger-soft);color:var(--danger);margin-left:4px;vertical-align:middle}
.tag.good{background:var(--good-soft);color:var(--good)}
.neg{color:var(--danger)}
.goodnum{color:var(--good)}
.banner{background:var(--good-soft);border:1.5px solid var(--good);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.banner h2{color:var(--good)}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:99px}

/* Saisie */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:3px 3px 6px;margin:-3px -3px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;flex-direction:column;align-items:flex-start;padding:8px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);min-width:92px}
.tab.on{border-color:var(--accent);background:var(--accent-soft)}
.tab b{font-family:var(--f-display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.tab small{font-weight:700;font-size:.8rem;max-width:120px}
.cards{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.cardbtn{min-width:0;padding:0;position:relative;aspect-ratio:3/4;max-width:100%;border-radius:9px;border:1.5px solid var(--border);background:var(--surface);font-family:var(--f-display);font-weight:800;font-size:1.15rem;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.cardbtn.on{background:var(--cc,var(--accent));border-color:var(--cc,var(--accent));color:#fff}
.cardbtn .cnt{position:absolute;top:-7px;right:-7px;background:var(--ink);color:var(--surface);border-radius:99px;font-size:.7rem;padding:1px 6px}
.mods{display:flex;flex-wrap:wrap;gap:8px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-weight:700;width:100%;text-align:left}
.toggle .sw{width:46px;height:28px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);position:relative;flex:none;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink-soft);transition:transform .15s}
.toggle.on .sw{background:var(--accent)}
.toggle.on .sw::after{transform:translateX(18px);background:var(--accent-ink)}
.toggle.bust.on{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.toggle.bust.on .sw{background:var(--danger)}
.scorebig{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.exp{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px dashed var(--border)}
.exp:last-child{border-bottom:0}
.exp .cards{grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.exp-head{display:grid;grid-template-columns:minmax(0,1fr) auto 3.4ch;gap:8px;align-items:center}
.exp-head .stepper{gap:4px}
.exp-head .icon-btn{width:32px;height:32px;font-size:1.05rem}
.bet{display:inline-flex;align-items:center;gap:1px;min-width:3ch;justify-content:center;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.bet i{font-style:normal;font-size:.85rem}
.exp .cardbtn{font-size:.95rem;border-radius:7px}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper .icon-btn{width:36px;height:36px}
.skyrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.skyrow:last-child{border-bottom:0}
.skyrow .inp{display:flex;gap:6px;align-items:center}
.skyrow input{width:76px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:1.15rem}
.fin{min-height:42px;padding:0 10px;border-radius:10px;border:1.5px solid var(--border);font-size:.8rem;font-weight:700;background:var(--surface)}
.fin.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.negwrap{position:relative;display:block}
.negwrap .minus{position:absolute;left:10px;top:50%;transform:translateY(-52%);font-family:var(--f-display);font-weight:800;font-size:1.15rem;color:var(--danger);pointer-events:none}
.swrow .negwrap input{width:100%;color:var(--danger);padding-left:22px}
.coinwrap .coin{position:absolute;left:9px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a0,#d99a00 60%,#9a6a00);box-shadow:inset 0 0 0 1.5px rgba(120,80,0,.5);pointer-events:none}
.swrow .coinwrap input{color:var(--ink);padding-left:26px}
.share-box{display:flex;justify-content:center}
.qr{width:210px;height:210px;border-radius:14px;box-shadow:var(--shadow)}
.sync-pill{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-soft)}
.sync-pill[data-state="online"]{background:var(--good-soft);color:var(--good)}
.sync-pill[data-state="error"]{background:var(--danger-soft);color:var(--danger)}
.swconv{color:var(--accent);font-weight:700;font-size:.9rem;margin-left:4px}
.azwall{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;max-width:330px;width:100%;margin:0 auto}
.az-cell{background-size:86% 86%;background-position:center;background-repeat:no-repeat;aspect-ratio:1;max-width:100%;border-radius:9px;border:2px dashed color-mix(in srgb,var(--tc) 60%,transparent);background-color:color-mix(in srgb,var(--tc) 14%,var(--surface))}
.az-cell.old{background-color:var(--tc);border:2px solid color-mix(in srgb,var(--tc) 70%,#000);opacity:.85}
.az-cell.new{background-color:var(--tc);border:2px solid var(--ink);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.az-det{text-align:center;min-height:1.3em}
.swrow{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.swrow:last-child{border-bottom:0}
.swrow.sci{grid-template-columns:1fr;gap:8px}
.swl{display:flex;gap:10px;align-items:center;min-width:0}
.swl > div{display:flex;flex-direction:column;min-width:0;flex:1}
.swl .dot{width:14px;height:14px}
.swrow input{text-align:center;font-family:var(--f-display);font-weight:700;font-size:1.1rem;padding:8px 6px}
.swv{text-align:right;color:var(--accent);white-space:nowrap}
.scigrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:end}
.sci-hint{color:var(--good);font-weight:700;min-height:1.2em}
.scigrid label{display:flex;flex-direction:column;gap:4px;align-items:center}
.sky-prev{font-size:.82rem;color:var(--ink-soft);min-height:1.1em}
.sticky-actions{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;padding:10px;margin-inline:-10px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(6px);border-radius:16px;z-index:5}
.sticky-actions .btn{flex:1}

/* Graphique */
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ch-grid{stroke:var(--border);stroke-width:1}
.ch-grid.zero{stroke:var(--ink-soft);stroke-opacity:.5}
.ch-target{stroke:var(--ink-soft);stroke-width:1.2;stroke-dasharray:4 4}
.ch-tick{font-family:var(--f-body);font-size:10px;fill:var(--ink-soft);font-variant-numeric:tabular-nums}
.ch-end{font-family:var(--f-body);font-size:11px;font-weight:700;fill:var(--ink)}
.ch-cross{stroke:var(--ink-soft);stroke-width:1}
.ch-tip{position:absolute;top:0;min-width:150px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);font-size:.84rem;display:flex;flex-direction:column;gap:4px;pointer-events:none;z-index:2}
.ch-tip[hidden]{display:none}

/* Stats */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;text-align:center}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pod b{max-width:100%}
.avatar.big{width:46px;height:46px;font-size:1.1rem}
.pod.r1 .avatar.big{width:58px;height:58px;font-size:1.3rem;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--pc)}
.step{width:100%;border-radius:10px 10px 4px 4px;background:var(--accent-soft);display:flex;align-items:flex-start;justify-content:center;padding-top:6px;margin-top:4px}
.step .num{font-size:1.3rem;color:var(--accent)}
.pod.r1 .step{height:74px;background:var(--accent)}.pod.r1 .step .num{color:var(--accent-ink)}
.pod.r2 .step{height:52px}.pod.r3 .step{height:36px}
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.award{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.award-t{font-family:var(--f-display);font-weight:800;font-size:.95rem;color:var(--accent)}
.ptable td{font-size:.95rem}
.swt td:first-child{font-family:var(--f-body);font-weight:700;color:var(--ink)}
.swt tbody{cursor:pointer}
.ptable td:first-child{font-family:var(--f-body);font-weight:700;color:var(--ink);font-size:.9rem}
.ptable tbody tr{cursor:default}
.bar{display:grid;grid-template-columns:minmax(0,7.5rem) 1fr auto;gap:10px;align-items:center}
.bar .track{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--pc,var(--accent));border-radius:99px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.78rem;color:var(--ink-soft);font-weight:700}

/* Barre d'onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{display:grid;grid-template-columns:repeat(4,1fr);max-width:580px;width:100%}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;font-size:.74rem;font-weight:700;color:var(--ink-soft)}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Thèmes de page par jeu */
body[data-theme]:not([data-theme=""]){background-image:none;background-attachment:fixed}
body[data-theme]:not([data-theme=""])::before{display:none}
body[data-theme="skyjo"]{--surface-2:#e9f0fb;--border:#d3deef;--accent:#1f5fc4;--accent-soft:#e1ecfb;--paper:#eef4fb;background:linear-gradient(165deg,#e6efff 0%,#eaf6ec 50%,#fff2e2 100%) fixed}
body[data-theme="flip7"]{--surface-2:#f9e9ea;--border:#ecd2d5;--accent:#b3122f;--accent-soft:#fbe3e7;--paper:#fff7ea;background:radial-gradient(circle at 100% 0%,#fde3e3 0%,#fff7ea 45%) fixed}
body[data-theme="lostcities"]{--surface-2:#f2e6cf;--border:#e2d0ac;--accent:#8a5a1f;--accent-soft:#f1e3c6;--paper:#f6ecd8;background:linear-gradient(180deg,#f7eedb 0%,#efdfbd 100%) fixed}
body[data-theme="azul"]{--surface-2:#e8eefb;--border:#d0dbf0;--accent:#1f5fc4;--accent-soft:#e1eafb;--paper:#eef3fb;background:radial-gradient(circle at 100% 0%,#dfe9fb 0%,#f2f6fc 50%) fixed}
body[data-theme="sevenw"]{--surface-2:#efe5d1;--border:#ddcdac;--accent:#7d5a28;--accent-soft:#efe2c8;--paper:#f3ead8;background:linear-gradient(180deg,#f5eddc 0%,#e9dbbd 100%) fixed}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body[data-theme="skyjo"]{--surface:#16203a;--surface-2:#1f2a48;--border:#2d3a5c;--accent:#7fb0ff;--accent-soft:#1e2f52;background:linear-gradient(165deg,#0f1a33 0%,#0f2118 55%,#2a1a10 100%) fixed}
 :root:not([data-theme="light"]) body[data-theme="flip7"]{--surface:#22141a;--surface-2:#2e1a21;--border:#46262e;--accent:#ff7085;--accent-soft:#3a1520;background:radial-gradient(circle at 100% 0%,#3a0f19 0%,#170b0f 50%) fixed}
 :root:not([data-theme="light"]) body[data-theme="lostcities"]{--surface:#231c11;--surface-2:#2f2618;--border:#45381f;--accent:#e0b36a;--accent-soft:#3a2d18;background:linear-gradient(180deg,#1d170e 0%,#2a2010 100%) fixed}
 :root:not([data-theme="light"]) body[data-theme="azul"]{--surface:#121d38;--surface-2:#1a2747;--border:#2a3a63;--accent:#7fa8ff;--accent-soft:#1b2a4d;background:radial-gradient(circle at 100% 0%,#14285a 0%,#0a1228 55%) fixed}
 :root:not([data-theme="light"]) body[data-theme="sevenw"]{--surface:#211a10;--surface-2:#2c2316;--border:#43361f;--accent:#d9b37a;--accent-soft:#352a1a;background:linear-gradient(180deg,#17120b 0%,#251c10 100%) fixed}}
:root[data-theme="dark"] body[data-theme="skyjo"]{--surface:#16203a;--surface-2:#1f2a48;--border:#2d3a5c;--accent:#7fb0ff;--accent-soft:#1e2f52;background:linear-gradient(165deg,#0f1a33 0%,#0f2118 55%,#2a1a10 100%) fixed}
:root[data-theme="dark"] body[data-theme="flip7"]{--surface:#22141a;--surface-2:#2e1a21;--border:#46262e;--accent:#ff7085;--accent-soft:#3a1520;background:radial-gradient(circle at 100% 0%,#3a0f19 0%,#170b0f 50%) fixed}
:root[data-theme="dark"] body[data-theme="lostcities"]{--surface:#231c11;--surface-2:#2f2618;--border:#45381f;--accent:#e0b36a;--accent-soft:#3a2d18;background:linear-gradient(180deg,#1d170e 0%,#2a2010 100%) fixed}
:root[data-theme="dark"] body[data-theme="azul"]{--surface:#121d38;--surface-2:#1a2747;--border:#2a3a63;--accent:#7fa8ff;--accent-soft:#1b2a4d;background:radial-gradient(circle at 100% 0%,#14285a 0%,#0a1228 55%) fixed}
 :root[data-theme="dark"] body[data-theme="sevenw"]{--surface:#211a10;--surface-2:#2c2316;--border:#43361f;--accent:#d9b37a;--accent-soft:#352a1a;background:linear-gradient(180deg,#17120b 0%,#251c10 100%) fixed}
body[data-theme="sevenw"] .eyebrow,body[data-theme="lostcities"] .eyebrow{letter-spacing:.12em}
/* Animations */
.btn,.chip,.cardbtn,.icon-btn,.tab,.fin,.game,.resume,.chooser-cta{transition:transform .12s ease,background-color .15s,border-color .15s,color .15s}
.btn:active,.chip:active,.cardbtn:active,.icon-btn:active,.tab:active,.fin:active,.game:active,.resume:active,.chooser-cta:active{transform:scale(.96)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
@media (prefers-reduced-motion:no-preference){
  .game .gart{transition:transform .3s}.game:active .gart{transform:rotate(-3deg) scale(1.05)}
  .enter > *{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
  .enter > *:nth-child(2){animation-delay:.04s}.enter > *:nth-child(3){animation-delay:.08s}.enter > *:nth-child(4){animation-delay:.12s}.enter > *:nth-child(5){animation-delay:.16s}.enter > *:nth-child(n+6){animation-delay:.2s}
  .enter .games > *{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
  .enter .games > *:nth-child(2){animation-delay:.07s}.enter .games > *:nth-child(3){animation-delay:.14s}.enter .games > *:nth-child(4){animation-delay:.21s}
  .enter .award{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
  .enter .award:nth-child(1){animation-delay:.55s}.enter .award:nth-child(2){animation-delay:.65s}.enter .award:nth-child(3){animation-delay:.75s}.enter .award:nth-child(4){animation-delay:.85s}
  .refresh .pod .step{animation:grow .45s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:bottom}
  .refresh .award{animation:rise .3s ease-out both}
  .enter .pod .step{animation:grow .6s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:bottom}
  .enter .pod > :not(.step){animation:popin .45s cubic-bezier(.3,1.5,.5,1) both}
  .enter .pod.r3 .step{animation-delay:.1s}.enter .pod.r3 > :not(.step){animation-delay:.35s}
  .enter .pod.r2 .step{animation-delay:.2s}.enter .pod.r2 > :not(.step){animation-delay:.45s}
  .enter .pod.r1 .step{animation-delay:.3s}.enter .pod.r1 > :not(.step){animation-delay:.6s}
  .enter .ch-line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s .15s ease-out forwards}
  .enter .chart circle{animation:popin .35s 1.05s both}
  .enter .banner{animation:popin .5s .1s cubic-bezier(.3,1.4,.5,1) both}
  .pop{animation:pop .22s ease-out}
  tr.flash td{animation:flash 1.4s ease-out}
  tfoot.bump td{animation:flash 1.4s .2s ease-out}
  .yay{display:inline-block;animation:wiggle .6s ease-in-out}
  .tabbar button.on svg{animation:hop .35s cubic-bezier(.3,1.6,.5,1)}
  .rv-row.new{animation:popin .45s cubic-bezier(.3,1.4,.5,1)}
  .enter > .chooser{animation:fadein .3s both}
}
@keyframes fadein{from{opacity:0}}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes popin{from{opacity:0;transform:scale(.6)}}

<script>
/*SCORING-START*/
const LC_COLORS=[{k:'jaune',n:'Désert',in:'dans le Désert',c:'#e2a90a'},{k:'bleu',n:'Royaume de Neptune',in:'dans le Royaume de Neptune',c:'#2f74d0'},{k:'blanc',n:'Himalaya',in:"dans l'Himalaya",c:'#8b92a3'},{k:'vert',n:'Forêt tropicale',in:'dans la Forêt tropicale',c:'#3a9a46'},{k:'rouge',n:'Volcans',in:'dans les Volcans',c:'#d43f37'},{k:'violet',n:'Planète alien',in:'sur la Planète alien',c:'#8a4fd0'}];
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
function toInt(v){const n=parseInt(v,10);return Number.isFinite(n)?n:0}
function lcExp(e){if(!e)return 0;const n=(e.cards||[]).length,w=e.w||0;if(!n&&!w)return 0;return (sum(e.cards)-20)*(1+w)+(n+w>=8?20:0)}

function f7Player(v,p){
  p=p||{};const nums=p.nums||[],mods=p.mods||[];const s=sum(nums),m=sum(mods);

function appUrl(){return /^https?:/.test(location.protocol)?location.origin+location.pathname:APP_URL}
function inviteLink(){return appUrl()+(SYNC.gid&&UI.shareGroup!==false?'#g='+SYNC.gid:'')}
function qrSvg(text){if(typeof qrcode!=='function')return '';const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount();let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="-3 -3 ${n+6} ${n+6}" class="qr" shape-rendering="crispEdges" role="img" aria-label="QR code du lien"><rect x="-3" y="-3" width="${n+6}" height="${n+6}" rx="2" fill="#fff"/><path d="${d}" fill="#1b2133"/></svg>`}
function shareCard(){const withG=SYNC.gid&&UI.shareGroup!==false;
  return `<div class="card"><h3>Inviter quelqu'un</h3>
    ${SYNC.gid?`<div class="row"><button class="chip ${withG?'on':''}" data-a="share-mode" data-m="g">Appli + groupe</button><button class="chip ${withG?'':'on'}" data-a="share-mode" data-m="a">Appli seule</button></div>`:''}
    <div class="share-box">${qrSvg(inviteLink())}</div>
    <p class="muted small" style="text-align:center">${withG?"Scanné avec l'appareil photo, il ouvre l'appli et rejoint votre groupe. À ne donner qu'à tes proches.":"Scanné avec l'appareil photo, il ouvre l'appli."}</p>
    <div class="row" style="justify-content:center">${navigator.share?`<button class="btn primary" data-a="share-send">Envoyer le lien</button>`:''}<button class="btn" data-a="share-copy">${UI.linkCopied?'Lien copié':'Copier le lien'}</button></div></div>`}
function joinGid(g){SYNC.gid=g;try{localStorage.setItem(GROUP_KEY,JSON.stringify({gid:g}))}catch(_){}synced={players:{},games:{}};saveSynced();UI.pendingJoin=null;window.syncStatus('connecting');startSync()}
function checkInvite(){const m=location.hash.match(/^#g=([0-9a-f]{64})$/);if(!m)return false;try{history.replaceState(history.state,'',location.pathname+location.search)}catch(_){}
  if(SYNC.gid===m[1])UI.toast='Tu fais déjà partie de ce groupe.';else if(SYNC.gid)UI.pendingJoin=m[1];else{joinGid(m[1]);UI.toast='Groupe rejoint ! Les joueurs et les parties arrivent.'}return true}
addEventListener('hashchange',()=>{if(checkInvite())go('home')});
function inviteBanner(){if(UI.pendingJoin)return `<div class="card"><p><b>Ce lien t'invite dans un autre groupe.</b> Le rejoindre ? Tes parties actuelles restent sur ce téléphone mais ne seront plus partagées.</p><div class="row"><button class="btn primary" data-a="invite-yes">Rejoindre</button><button class="btn" data-a="invite-no">Ignorer</button></div></div>`;
  return UI.toast?`<div class="banner"><p><b>${esc(UI.toast)}</b></p></div>`:''}
function startSync(){if(!SYNC.gid)return;const go=()=>window.FB&&FB.start(SYNC.gid);if(window.FB)go();else addEventListener('fb-ready',go,{once:true})}

function scoreTable(g,editable){
  const t=totals(g);const vals=g.players.map(p=>t[p.id]);
  const best=g.rounds.length?(isLow(g)?Math.min(...vals):Math.max(...vals)):null;
  return `<div class="scroll-x"><table class="scores"><thead><tr><th>Manche</th>${g.players.map(p=>`<th><span class="row" style="gap:6px;justify-content:center;flex-wrap:nowrap"><span class="dot" style="--pc:${p.color}"></span>${esc(p.name)}${kamikaze(g,p.id)?'<span class="kami" title="Kamikaze : 3 sauts d\'affilée">💥</span>':''}</span></th>`).join('')}</tr></thead>
  <tbody>${g.rounds.map((r,i)=>{const{scores,meta}=roundScores(g,r);return `<tr class="${UI.flash===i?'flash':''}" ${editable?`data-a="edit-round" data-i="${i}"`:''}><td>${i+1}${editable?' ✎':''}</td>${g.players.map(p=>`<td class="${scores[p.id]<0?(isLow(g)?'goodnum':'neg'):''}">${fmt(scores[p.id])}${meta[p.id]?`<span class="tag ${meta[p.id]==='Flip 7'||/bonus/.test(meta[p.id])?'good':''}">${meta[p.id]}</span>`:''}</td>`).join('')}</tr>`}).join('')||`<tr><td colspan="${g.players.length+1}" class="muted" style="text-align:center;font-family:var(--f-body);font-weight:400">Aucune manche pour l'instant</td></tr>`}
  ${(()=>{const fb=azShown(g);return fb?`<tr class="az-bonus"><td>Bonus</td>${g.players.map(p=>`<td title="${fb[p.id].rows} ligne(s), ${fb[p.id].cols} colonne(s), ${fb[p.id].colors} couleur(s)">+${fb[p.id].pts}</td>`).join('')}</tr>`:''})()}</tbody>
  <tfoot class="${UI.flash!=null?'bump':''}"><tr><td>Total</td>${g.players.map(p=>azHidden(g)&&azFinal(g)?`<td class="muted">?</td>`:`<td class="${best!==null&&t[p.id]===best?'lead':''}">${fmt(t[p.id])}</td>`).join('')}</tr></tfoot></table></div>`;
}
function niceStep(range){const raw=range/4;const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const f=raw/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function chartData(g){
  const cum={};g.players.forEach(p=>cum[p.id]=[0]);
  g.rounds.forEach(r=>{const{scores}=roundScores(g,r);g.players.forEach(p=>{const a=cum[p.id];a.push(a[a.length-1]+scores[p.id])})});
  const fb=azShown(g);if(fb)g.players.forEach(p=>{const a=cum[p.id];a.push(a[a.length-1]+fb[p.id].pts)});
  return cum;
}
function swTable(g,editable,hidden){
  if(!g.rounds.length)return '';
  const r=g.rounds[0],t=totals(g),vals=g.players.map(p=>t[p.id]),best=Math.max(...vals);
  return `<div class="scroll-x"><table class="scores swt"><thead><tr><th>Catégorie</th>${g.players.map(p=>`<th><span class="row" style="gap:6px;justify-content:center;flex-wrap:nowrap"><span class="dot" style="--pc:${p.color}"></span>${esc(p.name)}</span></th>`).join('')}</tr></thead>
  <tbody ${editable?'data-a="edit-round" data-i="0"':''}>${(()=>{const act=swCats(g);return SW_GROUPS.map(([nm,ks])=>[nm,act.filter(c=>ks.includes(c.k))]).filter(([,cs])=>cs.length).map(([nm,cs])=>`<tr><td><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="dot" style="--pc:${cs[0].c}"></span>${nm}</span></td>${g.players.map(p=>{const v=cs.reduce((t,c)=>t+swCat(r.sheet[p.id],c),0);return `<td class="${v<0?'neg':''}">${v?fmt(v):'<span class="muted">·</span>'}</td>`}).join('')}</tr>`).join('')})()}</tbody>
  <tfoot><tr><td>Total${editable?' ✎':''}</td>${g.players.map(p=>hidden?`<td class="muted">?</td>`:`<td class="${t[p.id]===best?'lead':''}">${fmt(t[p.id])}</td>`).join('')}</tr></tfoot></table></div>`;
}
function scoreChart(g){
  if(!g.rounds.length||g.type==='sevenw')return '';
  const cum=chartData(g),n=cum[g.players[0].id].length-1,bonusStep=!!azShown(g);
  const all=g.players.flatMap(p=>cum[p.id]);
  const target=g.type==='skyjo'?100:g.type==='flip7'?200:null;
  let lo=Math.min(0,...all),hi=Math.max(1,...all);
  const showTarget=target&&hi>=target*.6;if(showTarget)hi=Math.max(hi,target);
  const step=niceStep(hi-lo);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const labels=g.players.length<=4;
  const W=340,H=210,L=36,R=labels?62:14,T=12,B=26;
  const x=i=>L+(n?i/n:0)*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let grid='';for(let v=lo;v<=hi+1e-9;v+=step)grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="ch-grid${v===0?' zero':''}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="ch-tick">${fmt(v)}</text>`;
  const every=Math.ceil(n/8);let xt='';for(let i=0;i<=n;i++)if(i%every===0||i===n)xt+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" class="ch-tick">${i===0?'':bonusStep&&i===n?'Bonus':i}</text>`;
  const tgt=showTarget?`<line x1="${L}" x2="${W-R}" y1="${y(target)}" y2="${y(target)}" class="ch-target"/><text x="${W-R}" y="${y(target)-5}" text-anchor="end" class="ch-tick">Fin à ${target}</text>`:'';
  const lines=g.players.map(p=>{const pts=cum[p.id].map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');return `<polyline pathLength="1" class="ch-line" points="${pts}" fill="none" stroke="${p.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(n)}" cy="${y(cum[p.id][n])}" r="4.5" fill="${p.color}" stroke="var(--surface)" stroke-width="2"/>`}).join('');
  let ends='';
  if(labels){const items=g.players.map(p=>({p,v:cum[p.id][n],yy:y(cum[p.id][n])})).sort((a,b)=>a.yy-b.yy);
    for(let i=1;i<items.length;i++)if(items[i].yy-items[i-1].yy<13)items[i].yy=items[i-1].yy+13;
    ends=items.map(it=>`<text x="${W-R+9}" y="${it.yy+4}" class="ch-end">${esc(it.p.name.slice(0,7))}</text>`).join('')}
  const cols=[];for(let i=0;i<=n;i++){const x0=i===0?L:(x(i-1)+x(i))/2,x1=i===n?W-R:(x(i)+x(i+1))/2;cols.push(`<rect x="${x0}" y="${T}" width="${Math.max(0,x1-x0)}" height="${H-T-B}" fill="transparent" data-i="${i}"/>`)}
  return `<div class="card"><div class="row between"><p class="eyebrow">Évolution des totaux</p></div>
  <div class="row" style="gap:12px">${g.players.map(p=>`<span class="row small" style="gap:6px"><span class="dot" style="--pc:${p.color}"></span>${esc(p.name)}</span>`).join('')}</div>
  <div class="chart" id="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Total cumulé de chaque joueur par manche">${grid}${xt}${tgt}${lines}${ends}<line id="ch-x" class="ch-cross" x1="0" x2="0" y1="${T}" y2="${H-B}" visibility="hidden"/><g id="ch-hits">${cols.join('')}</g></svg><div class="ch-tip" id="ch-tip" hidden></div></div></div>`;
}
function attachChart(){
  const box=document.getElementById('chart');if(!box)return;const g=gameById(UI.gameId);const cum=chartData(g);
  const tip=document.getElementById('ch-tip'),cross=document.getElementById('ch-x'),svg=box.querySelector('svg');
  const show=e=>{const r=e.target.closest('rect[data-i]');if(!r)return;const i=+r.dataset.i;
    const pt=svg.createSVGPoint();const rx=+r.getAttribute('x')+(+r.getAttribute('width'))/2;
    const n=cum[g.players[0].id].length-1,bs=!!azShown(g);const W=340,L=36,R=g.players.length<=4?62:14;const cx=L+(n?i/n:0)*(W-L-R);
    cross.setAttribute('x1',cx);cross.setAttribute('x2',cx);cross.setAttribute('visibility','visible');
    const rows=[...g.players].sort((a,b)=>isLow(g)?cum[a.id][i]-cum[b.id][i]:cum[b.id][i]-cum[a.id][i]);
    tip.innerHTML=`<b>${i===0?'Départ':bs&&i===n?'Après les bonus de fin':'Après la manche '+i}</b>`+rows.map(p=>`<div class="row between" style="gap:12px;flex-wrap:nowrap"><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="dot" style="--pc:${p.color}"></span>${esc(p.name)}</span><span class="num">${fmt(cum[p.id][i])}</span></div>`).join('');
    tip.hidden=false;const bw=box.clientWidth,px=cx/W*bw;tip.style.left=Math.min(Math.max(px-tip.offsetWidth/2,0),bw-tip.offsetWidth)+'px'};
  const hide=()=>{tip.hidden=true;cross.setAttribute('visibility','hidden')};
  svg.addEventListener('pointermove',show);svg.addEventListener('pointerdown',show);svg.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hide()});
  document.addEventListener('pointerdown',e=>{if(!box.contains(e.target))hide()},{once:true});
}
function ranking(g,t){return [...g.players].sort((a,b)=>isLow(g)?t[a.id]-t[b.id]:t[b.id]-t[a.id])}

V.game=()=>{
  const g=gameById(UI.gameId);if(!g){UI.view='home';return V.home()}
  const done=g.status==='done';const hidden=(g.type==='sevenw'&&!done&&g.rounds.length&&!g.revealed)||(azHidden(g)&&!!azFinal(g));const end=done||hidden?null:endState(g);const t=totals(g);
  const target=g.type==='skyjo'?100:g.type==='flip7'?200:null;
  let progress='';
  if(target&&!done){const top=Math.max(...g.players.map(p=>t[p.id]),0);progress=`<div class="stack" style="gap:6px"><div class="row between small"><span class="muted">${g.type==='skyjo'?'Plus haut total':'Meneur'}</span><span class="num">${top} / ${target}</span></div><div class="progress"><span style="width:${Math.min(100,top/target*100)}%"></span></div></div>`}
  else if(g.type==='lostcities'&&!done)progress=`<p class="muted small">Manche ${Math.min(g.rounds.length+1,g.nRounds)} sur ${g.nRounds}</p>`;
  const winnersTxt=w=>w.map(id=>esc(g.players.find(p=>p.id===id).name)).join(' et ');
  return `
  ${gameHead(g.type,done?'Partie terminée · '+new Date(g.endedAt).toLocaleDateString('fr-FR'):'Partie en cours',esc(gameLabel(g)),g.type==='sevenw'?(g.exp&&g.exp.length?'Avec '+g.exp.map(k=>SW_EXP[k]).join(', '):'Jeu de base'):'',`<button class="btn ghost" data-a="nav" data-v="${done?'history':'home'}">${done?'Retour':'Accueil'}</button>`)}
  ${progress}
  ${end?`<div class="banner">${end.winners.length===g.players.length&&g.players.length>1?(setTimeout(()=>eggFound('tie'),1200),`<h2>Égalité parfaite ! 🤝</h2><p class="small">Tout le monde gagne… ou personne.</p>`):`<h2>${end.winners.length>1?'Égalité : ':''}${winnersTxt(end.winners)} ${end.winners.length>1?'gagnent':'gagne'} !</h2>`}${end.coinTie?'<p class="small"><b>Égalité de points, départagée au trésor.</b></p>':''}<button class="btn primary" data-a="finish">Enregistrer dans l'historique</button></div>`:''}
  ${done?`<div class="card"><p class="eyebrow">Classement</p><div class="list">${ranking(g,t).map((p,i)=>`<div><span class="num" style="width:1.6ch;color:var(--ink-soft)">${i+1}</span><span class="avatar" style="--pc:${p.color}">${avt(p)}</span><b class="grow ellipsis">${esc(p.name)}${g.winners.includes(p.id)?' 🏆':''}</b><span class="num" style="font-size:1.2rem">${fmt(t[p.id])}</span></div>`).join('')}</div></div>`:''}
  ${hidden?`<div class="banner reveal-cta"><h2>${g.type==='azul'?'Un mur a une ligne complète !':'Tous les scores sont saisis'}</h2><button class="btn primary" data-a="reveal">${g.type==='azul'?'Révéler les bonus de fin':'Révéler le classement'}</button></div>`:''}
  ${g.type==='sevenw'?swTable(g,!done,hidden):scoreTable(g,!done)}
  ${!done&&!end&&!hidden?`<button class="btn primary block" data-a="new-round">${g.type==='sevenw'?'Saisir le décompte final':'Saisir la manche '+(g.rounds.length+1)}</button>`:''}
  ${scoreChart(g)}
  ${done?(UI.confirmDelGame?`<div class="card"><p>Supprimer cette partie de l'historique ? Les stats seront recalculées.</p><div class="row"><button class="btn danger" data-a="del-game">Supprimer</button><button class="btn" data-a="cancel-del-game">Garder</button></div></div>`:`<button class="btn ghost" data-a="ask-del-game">Supprimer cette partie</button>`)
   :(UI.confirmDelGame?`<div class="card"><p>Abandonner la partie ? Elle ne sera pas gardée dans l'historique.</p><div class="row"><button class="btn danger" data-a="del-game">Abandonner</button><button class="btn" data-a="cancel-del-game">Continuer à jouer</button></div></div>`:`<button class="btn ghost" data-a="ask-del-game">Abandonner la partie</button>`)}
`;
};

/* Saisie de manche */
function newDraftData(g){
  if(g.type==='azul'){const p={};g.players.forEach(pl=>p[pl.id]={place:[],floor:0});return{p}}
  if(g.type==='skyjo')return{raw:{},finisher:null};
  if(g.type==='sevenw'){const sheet={};g.players.forEach(p=>sheet[p.id]={sci:{}});return{sheet}}
  if(g.type==='lostcities'){const exp={};g.players.forEach(p=>{exp[p.id]={};LC_COLORS.forEach(c=>exp[p.id][c.k]={w:0,cards:[]})});return{exp}}
  const p={};g.players.forEach(pl=>p[pl.id]={nums:[],mods:[],mult:false,bust:false,lucky:false,choice:'self'});return{p};
}
V.round=()=>{
  const d=UI.draft,g=gameById(d.gameId);
  const title=g.type==='sevenw'?(d.index===null?'Décompte final':'Correction du décompte'):d.index===null?`Manche ${g.rounds.length+1}`:`Correction manche ${d.index+1}`;
  let body='';
  if(g.type==='skyjo')body=skyjoEditor(g,d);
  else if(g.type==='lostcities')body=lcEditor(g,d);
  else if(g.type==='sevenw')body=swEditor(g,d);
  else if(g.type==='azul')body=azEditor(g,d);
  else body=f7Editor(g,d);
  return `${gameHead(g.type,esc(gameLabel(g)),title,'','')}
  ${body}
  ${UI.roundErr?`<p class="err" style="padding-left:8px">${esc(UI.roundErr)}</p>`:''}
  ${d.index!==null?(UI.confirmDelRound?`<div class="card"><p>${g.type==='sevenw'?'Effacer tout le décompte ?':'Supprimer la manche '+(d.index+1)+' ?'}</p><div class="row"><button class="btn danger" data-a="del-round">Supprimer</button><button class="btn" data-a="cancel-del-round">Garder</button></div></div>`:`<button class="btn ghost" data-a="ask-del-round">${g.type==='sevenw'?'Effacer le décompte':'Supprimer cette manche'}</button>`):''}
  <div class="sticky-actions"><button class="btn" data-a="cancel-round">Annuler</button><button class="btn primary" data-a="save-round">Valider</button></div>`;
};
function skyjoEditor(g,d){
  const sc=roundScores(g,d.data);
  return `<div class="card"><p class="eyebrow">Points de la manche</p>
  <div>${g.players.map(p=>{const v=d.data.raw[p.id]??'';return `<div class="skyrow"><div class="row grow" style="gap:8px;flex-wrap:nowrap"><span class="avatar" style="--pc:${p.color}">${avt(p)}</span><div class="grow"><b class="ellipsis" style="display:block">${esc(p.name)}</b><span class="sky-prev" id="prev-${p.id}">${sc.meta[p.id]?`Doublé : ${fmt(sc.scores[p.id])}`:''}</span></div></div>
    <div class="inp"><input type="text" inputmode="numeric" id="sky-${p.id}" data-in="sky" data-id="${p.id}" value="${esc(v)}" placeholder="0" autocomplete="off"></div>
    <button class="fin ${d.data.finisher===p.id?'on':''}" data-a="sky-fin" data-id="${p.id}">A fini</button></div>`}).join('')}</div></div>`;
}
function swFilled(sh){if(!sh)return false;const sc=sh.sci||{};return Object.keys(sh).some(k=>k!=='sci'&&String(sh[k]).trim()!=='')||['a','b','c'].some(k=>String(sc[k]??'').trim()!=='')||(sc.jk||[]).length>0}
function coinTxt(sh){const n=toInt(sh&&sh.coins),p=Math.floor(n/3);return n?`→ ${p} pt${p>1?'s':''}`:''}
function sciTxt(sh){const v=sciScore(sh&&sh.sci);return `${v} point${v>1?'s':''}`}
function swEditor(g,d){
  const active=d.tab||g.players[0].id;const sh=d.data.sheet[active];const name=g.players.find(p=>p.id===active).name;
  const inp=(k,v,lbl,sub)=>`<input type="text" inputmode="numeric" class="swin" data-in="sw" data-k="${k}"${sub?` data-sub="${sub}"`:''} value="${esc(v??'')}" placeholder="0" autocomplete="off" aria-label="${lbl}">`;
  return `${playerTabs(g,d,id=>swFilled(d.data.sheet[id])?'✓':'–')}
  <div class="card"><p class="eyebrow">Décompte de ${esc(name)}</p>
  <div>${swCats(g).map(c=>c.sci?`<div class="swrow sci"><div class="swl"><span class="dot" style="--pc:${c.c}"></span><div><b>${c.n}</b></div><span class="num swv" id="sw-v-sci">${sciTxt(sh)}</span></div>
      <div class="scigrid">${SCI.map(([k,l])=>`<label><span class="small muted">${l}</span>${inp('sci',(sh.sci||{})[k],l,k)}</label>`).join('')}
        <label><span class="small muted">Jokers</span><span class="stepper"><button class="icon-btn" data-a="sw-jk-n" data-d="-1" aria-label="Retirer un joker">−</button><span class="num">${(sh.sci&&sh.sci.jk||[]).length}</span><button class="icon-btn" data-a="sw-jk-n" data-d="1" aria-label="Ajouter un joker">+</button></span></label></div>
      ${(()=>{const jk=(sh.sci&&sh.sci.jk)||[];if(!jk.length)return '';const adv=sciAdvice(sh.sci);
        return `<div class="stack" style="gap:8px">${jk.map((v,i)=>`<div class="row" style="gap:8px"><span class="small"><b>Joker${jk.length>1?' '+(i+1):''}</b></span>${SCI.map(([k,l])=>`<button class="chip ${v===k?'on':''}" data-a="sw-jk" data-i="${i}" data-s="${k}">${l}</button>`).join('')}</div>`).join('')}
        <p class="small muted" id="sw-sci-adv">${esc(sciAdviceText(sh.sci))}</p></div>`})()}
      </div>`
    :`<div class="swrow"><div class="swl"><span class="dot" style="--pc:${c.c}"></span><div><b>${c.n}${c.coins?` <span class="swconv" id="sw-v-coins">${coinTxt(sh)}</span>`:''}</b>${c.h?`<span class="small muted">${c.h}</span>`:''}</div></div>${c.coins?inp(c.k,sh[c.k],'Trésor (nombre de pièces)').replace('placeholder="0"','placeholder="pièces"'):c.neg?`<span class="negwrap"><span class="minus" aria-hidden="true">−</span>${inp(c.k,sh[c.k],c.n+' (points retirés)')}</span>`:inp(c.k,sh[c.k],c.n)}</div>`).join('')}</div></div>`;
}
function azEditor(g,d){
  const active=d.tab||g.players[0].id;const pr=d.data.p[active];const idx=d.index!=null?d.index:g.rounds.length;
  const before=idx?azRun(g,g.rounds.slice(0,idx))[idx-1].walls[active]:azEmpty();
  const list=g.rounds.slice(0,idx).concat([d.data]);const run=azRun(g,list);const det=run[idx].det[active];const sc=roundScores(g,d.data);
  const has=(r,c)=>pr.place.some(([a,b])=>a===r&&b===c);
  const cells=[];for(let r=0;r<5;r++)for(let c=0;c<5;c++){const col=AZ_COLS[azColor(r,c)].c,old=before[r][c],now=has(r,c);
    cells.push(`<button class="az-cell ${old?'old':now?'new':''}" style="--tc:${col};background-image:${azMotif(azColor(r,c),!(old||now))}" ${old?'disabled':''} data-a="az-cell" data-r="${r}" data-c="${c}" aria-label="${AZ_COLS[azColor(r,c)].n} ligne ${r+1}"></button>`)}
  const fl=toInt(pr.floor);
  return `${playerTabs(g,d,id=>sc.scores[id])}
  <div class="card"><div class="row between"><p class="eyebrow">Mur de ${esc(g.players.find(p=>p.id===active).name)}</p><span class="scorebig ${sc.scores[active]<0?'neg':''}">${fmt(sc.scores[active])}</span></div>
    <div class="azwall">${cells.join('')}</div>
    <p class="small muted az-det">${det.tiles.length?'Tuiles : '+det.tiles.map(v=>'+'+v).join(' '):'Touche les tuiles posées sur le mur cette manche'}${det.pen?` · Plancher −${det.pen}`:''}</p>
    <div class="row between"><div><b>Plancher</b><span class="small muted" style="display:block">Tuiles cassées, jeton premier joueur compris</span></div>
      <span class="stepper"><button class="icon-btn" data-a="az-floor" data-d="-1" aria-label="Moins">−</button><span class="num" style="min-width:1.4ch;text-align:center">${fl}</span><button class="icon-btn" data-a="az-floor" data-d="1" aria-label="Plus">+</button></span></div>
  </div>`;
}

function playerStats(pred){
  const st={};
  S.games.filter(g=>g.status==='done'&&(!pred||pred(g))).forEach(g=>{
    g.players.forEach(p=>{const s=st[p.id]||(st[p.id]={name:p.name,color:p.color,played:0,wins:0});s.played++;if(g.winners.includes(p.id))s.wins++;
      const cur=player(p.id);if(cur){s.name=cur.name;s.color=cur.color}});
  });
  return st;
}
function aggregate(games){
  const P={};const get=id=>P[id]||(P[id]={played:0,wins:0,rounds:0,sum:0,best:null,fin:0,dbl:0,zero:0,flip:0,bust:0,mean:0,exp:0,good:0,bets:0,bestExp:null,types:new Set()});
  games.forEach(g=>{const low=g.type==='skyjo';
    g.players.forEach(p=>{const s=get(p.id);s.played++;s.types.add(g.type);if(g.winners.includes(p.id))s.wins++});
    g.rounds.forEach(r=>{const{scores,meta}=roundScores(g,r);g.players.forEach(p=>{const s=get(p.id),v=scores[p.id];s.rounds++;s.sum+=v;if(s.best===null||(low?v<s.best:v>s.best))s.best=v;
      if(g.type==='skyjo'){if(r.finisher===p.id)s.fin++;if(meta[p.id]==='×2')s.dbl++;if(v<=0)s.zero++}
      if(g.type==='flip7'){const pr=r.p[p.id]||{};const f=f7Player(g.variant,pr).flip;if(f)s.flip++;if(pr.bust)s.bust++;if(f&&pr.choice&&pr.choice!=='self')s.mean++}
      if(g.type==='sevenw'){const sh=r.sheet[p.id];s.sw=s.sw||{};s.swSum=s.swSum||{};swCats(g).forEach(c=>{const x=swCat(sh,c);if(s.sw[c.k]===undefined||x>s.sw[c.k])s.sw[c.k]=x;s.swSum[c.k]=(s.swSum[c.k]||0)+x})}
      if(g.type==='azul'){const pr=(r.p&&r.p[p.id])||{};s.casse=(s.casse||0)+toInt(pr.floor)}
      if(g.type==='lostcities')LC_COLORS.forEach(c=>{const e=r.exp[p.id]&&r.exp[p.id][c.k];if(e&&(e.cards.length||e.w)){const x=lcExp(e);s.exp++;if(x>0)s.good++;s.bets+=e.w;if(!s.bestExp||x>s.bestExp.v)s.bestExp={v:x,c:c.in}}});
    })})});
  return P;
}
function award(P,key,{title,line,min=1,low=false,filter}){
  const ids=Object.keys(P).filter(id=>(!filter||filter(P[id]))&&P[id][key]!==null&&(low||typeof P[id][key]!=='number'||P[id][key]>=min));
  if(!ids.length)return null;
  ids.sort((x,y)=>low?P[x][key]-P[y][key]:P[y][key]-P[x][key]);
  return {id:ids[0],title,line:line(P[ids[0]])};
}
const plural=(n,w)=>`${n} ${w}${n>1?'s':''}`;
function statTable(ft,P,ids,who){
  if(!ids.length)return '';

  area.addEventListener('pointerdown',e=>{e.preventDefault();if(C.phase==='result')return;
    const used=[...C.t.values()].map(t=>t.col);const col=TOUCH_COLORS.find(c=>!used.includes(c))||TOUCH_COLORS[rnd(TOUCH_COLORS.length)];
    const el=document.createElement('div');el.className='touch';el.style.setProperty('--c',col);place(el,e);area.appendChild(el);
    C.t.set(e.pointerId,{el,col});try{area.setPointerCapture(e.pointerId)}catch(_){}schedule()});
  area.addEventListener('pointermove',e=>{const t=C&&C.t.get(e.pointerId);if(t)place(t.el,e)});
  const up=e=>{if(!C)return;const t=C.t.get(e.pointerId);if(!t)return;C.t.delete(e.pointerId);
    if(C.phase==='result'){t.el.classList.add('gone');setTimeout(()=>t.el.remove(),400);if(C.t.size===0){C.phase='wait';msg()}return}
    t.el.remove();schedule()};
  area.addEventListener('pointerup',up);area.addEventListener('pointercancel',up);
  function pick(){
    if(!C||C.t.size<need())return;C.phase='result';area.classList.remove('arming');
    const ids=[...C.t.keys()];
    if(UI.ch.mode==='one'){const w=ids[rnd(ids.length)];ids.forEach(id=>C.t.get(id).el.classList.add(id===w?'win':'out'));msg('')}
    else{for(let i=ids.length-1;i>0;i--){const j=rnd(i+1);[ids[i],ids[j]]=[ids[j],ids[i]]}
      ids.forEach((id,i)=>{const team=i%UI.ch.teams;const el=C.t.get(id).el;el.style.setProperty('--c',TEAM_COLORS[team]);el.textContent=team+1});msg('')}
    try{navigator.vibrate&&navigator.vibrate(80)}catch(_){}
  }
}

window.claude?.hot?.snapshot?.(()=>({UI:UI.view==='chooser'?{...UI,view:'home'}:UI}));
const boot=d=>{if(d&&d.UI)UI=d.UI;checkInvite();render();startSync()};
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
